<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qo’lda yozilgan xat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--desk1:#e9dcc6;--desk2:#cdb99a;--ink:#1d3a8a;--paper:#fffaf0;--line:#b9d3e6;--margin:#e08a8a;--seal:#9c1f2e;--hint:#5a4630;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk1:#2b2118;--desk2:#171109;--hint:#d9c7a8}}
:root[data-theme="dark"]{--desk1:#2b2118;--desk2:#171109;--hint:#d9c7a8}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 30%,var(--desk1),var(--desk2));font-family:"Caveat","Segoe Script","Bradley Hand",cursive;overflow-x:hidden;display:flex;align-items:center;justify-content:center;min-height:100%}
.stage{position:relative;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 14px;box-sizing:border-box}
.hint{color:var(--hint);font-size:26px;text-align:center;transition:opacity .6s}
/* envelope */
.env{position:relative;width:min(88vw,340px);height:min(58vw,224px);perspective:900px;cursor:pointer;border:0;background:none;padding:0;transition:transform .9s .3s,opacity .8s .5s;animation:bob 3s ease-in-out infinite}
.env:focus-visible{outline:3px solid var(--seal);outline-offset:8px}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
.env .back,.env .front{position:absolute;inset:0;border-radius:6px}
.env .back{background:#d8b98a;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.env .front{background:linear-gradient(135deg,#ecd2a6 0 50%,transparent 50%),linear-gradient(225deg,#e6c897 0 50%,transparent 50%),linear-gradient(0deg,#f0d9b0,#e8cfa0);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;background:linear-gradient(#e3c391,#d3b07c);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:3}
.seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6475a,var(--seal) 60%,#6e121e);z-index:4;display:grid;place-items:center;color:#f7d9dd;font-size:30px;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:opacity .4s,transform .4s;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{opacity:0;transform:scale(.3);animation:none}
.open.env{transform:translateY(60px) scale(.9);opacity:0;animation:none;pointer-events:none}
/* paper */
.paper{position:relative;width:min(92vw,520px);box-sizing:border-box;padding:34px 26px 34px 62px;background:
 radial-gradient(circle at 20% 15%,rgba(210,180,130,.18),transparent 45%),
 radial-gradient(circle at 85% 90%,rgba(190,160,110,.2),transparent 50%),
 repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px),var(--paper);
 background-position:0 0,0 0,0 33px,0 0;
 border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.25),0 24px 50px rgba(0,0,0,.4);
 transform:rotate(-1.2deg) scaleY(0);transform-origin:top;opacity:0;display:none}
.paper::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(150,110,50,.25)}
.paper.show{display:block;animation:unfold 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes unfold{0%{transform:rotate(3deg) scaleY(.05);opacity:0}40%{opacity:1}100%{transform:rotate(-1.2deg) scaleY(1);opacity:1}}
.text{margin:0;color:var(--ink);font-size:clamp(22px,5.4vw,29px);line-height:36px;font-weight:500;white-space:pre-wrap;min-height:360px;text-shadow:0 0 1px rgba(29,58,138,.35);position:relative;z-index:1}
.text .pen{display:inline-block;width:2px;height:26px;background:var(--ink);vertical-align:-4px;margin-left:1px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sign{display:block;margin-top:6px;font-size:1.25em;transform:rotate(-3deg);transform-origin:left}
.btn{display:none;font:600 24px "Caveat","Segoe Script",cursive;color:#fff;background:var(--seal);border:0;border-radius:999px;padding:8px 26px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.04)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.on{display:block;animation:pop .6s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.petal{position:fixed;top:-30px;width:14px;height:18px;border-radius:70% 0 70% 0;pointer-events:none;opacity:.8;animation:fall linear infinite;z-index:0}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.env,.seal,.petal,.text .pen{animation:none}.petal{display:none}}
</style>
</head>
<body>
<main class="stage">
  <p class="hint" id="hint">Ustozim uchun xat — muhrni bosing</p>
  <button class="env" id="env" aria-label="Xatni ochish">
    <span class="back"></span>
    <span class="flap"></span>
    <span class="front"></span>
    <span class="seal">♥</span>
  </button>
  <article class="paper" id="paper" aria-live="polite">
    <p class="text" id="text"></p>
  </article>
  <button class="btn" id="again">Qayta o’qish</button>
</main>
<script>
(function(){
  var LETTER = "Hurmatli ustozim,\n\nBu xatni yuragimdan chiqqan iliq so’zlar bilan yozyapman. Bergan ilmingiz uchun «rahmat» deyishning o’zi kamlik qiladi.\n\nSiz bizga faqat dars bermadingiz — to’g’ri yashashni, mehnatdan charchamaslikni, o’zimizga ishonishni o’rgatdingiz. Har bir so’zingiz, har bir nasihatingiz yo’limizni chiroqdek yoritib turadi.\n\nAllohdan sizga sog’lik, uzoq umr, oilangizga baxt va farovonlik tilayman. Qalbingiz doim xotirjam, dasturxoningiz to’kin bo’lsin, shogirdlaringiz esa sizni har doim faxr bilan tilga olsin.\n\nUstoz — ota-onadek aziz inson. Siz bergan bilim bilan hayotda boshimni baland tutib yuraman.\n\nSizni chin dildan hurmat qiluvchi shogirdingiz Barchinoy,\n";
  var SIGN = "Shogirdingiz";
  var env = document.getElementById("env"), paper = document.getElementById("paper"),
      textEl = document.getElementById("text"), hint = document.getElementById("hint"),
      again = document.getElementById("again"), timer = null, started = false;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function petals(){
    if(reduce) return;
    var cols = ["#f4a6b8","#f7c6d0","#e98aa3","#fbd9a8"];
    for(var i=0;i<14;i++){
      var p = document.createElement("i");
      p.className = "petal";
      p.style.left = (Math.random()*100)+"vw";
      p.style.background = cols[i%cols.length];
      p.style.animationDuration = (9+Math.random()*9)+"s";
      p.style.animationDelay = (-Math.random()*12)+"s";
      p.style.setProperty("--dx",(Math.random()*160-80)+"px");
      p.style.setProperty("--rot",(360+Math.random()*540)+"deg");
      document.body.appendChild(p);
    }
  }

  function write(){
    clearTimeout(timer);
    again.classList.remove("on");
    textEl.textContent = "";
    var pen = document.createElement("span"); pen.className = "pen";
    var node = document.createTextNode(""); textEl.appendChild(node); textEl.appendChild(pen);
    var full = LETTER + SIGN, i = 0;
    function finish(){
      textEl.textContent = LETTER;
      var s = document.createElement("span"); s.className = "sign"; s.textContent = SIGN;
      textEl.appendChild(s);
      again.classList.add("on");
    }
    if(reduce){ finish(); return; }
    (function step(){
      if(i >= full.length){ finish(); return; }
      var ch = full.charAt(i++);
      node.nodeValue += ch;
      var d = 38 + Math.random()*30;
      if(ch === "," ) d += 180;
      if(ch === "." || ch === "\n") d += 260;
      timer = setTimeout(step, d);
    })();
    paper.onclick = function(){ clearTimeout(timer); finish(); };
  }

  function open(){
    if(started) return; started = true;
    hint.style.opacity = 0;
    env.classList.add("open");
    setTimeout(function(){
      env.style.display = "none"; hint.style.display = "none";
      paper.classList.add("show");
      setTimeout(write, 900);
    }, 1200);
  }

  env.addEventListener("click", open);
  again.addEventListener("click", function(){ write(); });
  petals();
})();
</script>
</body>
</html>
